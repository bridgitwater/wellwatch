# Manual fallback for funder notifications. The hourly schedule lives in
# Supabase Cron (supabase/cron.sql); run this from the Actions tab if needed.
name: notify
on:
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger notifications
        run: |
          curl --fail --silent --show-error --max-time 290 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/notify"
