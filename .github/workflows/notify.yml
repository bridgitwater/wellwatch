# Sends due funder emails and the admin digest. Hourly.
name: notify
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger notifications
        run: |
          curl --fail --silent --show-error --max-time 290 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/notify"
