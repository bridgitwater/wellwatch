# Manual fallback for the Drive sync. The schedule lives in Supabase Cron
# (supabase/cron.sql, every 10 minutes); run this from the Actions tab if that
# is ever down.
name: drive-sync
on:
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync
        run: |
          curl --fail --silent --show-error --max-time 290 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/drive-sync"
